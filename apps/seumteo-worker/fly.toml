# fly.toml app configuration file generated for jippin-seumteo-worker on 2026-07-09T05:05:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jippin-seumteo-worker'
primary_region = 'nrt'
swap_size_mb = 1024

[build]
  dockerfile = 'Dockerfile'

[env]
  SEUMTEO_MAX_CONCURRENCY = '1'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 2
    soft_limit = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'get'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
